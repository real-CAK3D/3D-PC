<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAK3D Station</title>
<style>
  :root { --bg: #05060c; --panel: #0d1124; --line: #23305e; --ink: #e8ecff; --dim: #8b94c4; --accent: #3d8bff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header b { font-size: 18px; letter-spacing: 2px; margin-right: auto; }
  input, select, button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); padding: 6px 8px; border-radius: 6px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #lib { width: min(420px, 60vw); }
  #status { padding: 8px 14px; color: var(--dim); }
  #games { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 14px; overflow-y: auto; height: calc(100% - 110px); }
  .game { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .game:hover { border-color: var(--accent); box-shadow: 0 0 14px rgba(61,139,255,.35); }
  .game img, .game .blank { width: 100%; aspect-ratio: 1; object-fit: contain; background: #000; border-radius: 6px; }
  .game .blank { display: grid; place-items: center; color: var(--dim); font-size: 28px; }
  .game small { color: var(--dim); text-transform: uppercase; }
  .game.off { opacity: .45; cursor: not-allowed; }
  .game.off:hover { border-color: var(--line); box-shadow: none; }
  #filter { min-width: 150px; }
  #player { position: fixed; inset: 0; background: #000; display: none; }
  #player.on { display: block; }
  #back { position: fixed; top: 8px; left: 8px; z-index: 10; display: none; }
  #player.on ~ #back { display: block; }
</style>
</head>
<body>
<header>
  <b>CAK3D STATION</b>
  <input id="lib" placeholder="ROM library URL (your tailnet)">
  <button id="save">Load library</button>
  <select id="filter" title="show one system"><option value="">All systems</option></select>
  <select id="core" title="system for local files">
    <option value="nds">Nintendo DS</option><option value="gba">Game Boy Advance</option><option value="gb">Game Boy / Color</option>
    <option value="nes">NES</option><option value="snes">SNES</option><option value="n64">N64</option><option value="psx">PlayStation</option>
    <option value="psp">PSP</option><option value="segaMD">Genesis</option>
  </select>
  <label><button id="pickBtn" type="button">Play a file from this device</button><input id="pick" type="file" hidden></label>
</header>
<div id="status">Loading library...</div>
<div id="games"></div>
<div id="player"><div id="game"></div></div>
<button id="back">Back to games</button>
<script>
  // The library is CAK3D's private ROM server on Tailscale (tools/rom-server.mjs in the 3D-PC repo).
  // Nothing is uploaded anywhere: games stream from that server, or from a file on this device.
  var DEFAULT_LIB = 'https://nukebox.tailac984b.ts.net:8420/';
  var libInput = document.getElementById('lib');
  var statusEl = document.getElementById('status');
  var grid = document.getElementById('games');
  var lib;
  try { lib = localStorage.getItem('cak3d-rom-library') || DEFAULT_LIB; } catch (e) { lib = DEFAULT_LIB; }
  libInput.value = lib;

  function load() {
    lib = libInput.value.trim();
    if (lib && !/\/$/.test(lib)) lib += '/';
    try { localStorage.setItem('cak3d-rom-library', lib); } catch (e) {}
    statusEl.textContent = 'Loading library...';
    grid.innerHTML = '';
    fetch(lib + 'index.json').then(function (r) { if (!r.ok) throw r.status; return r.json(); }).then(function (data) {
      allGames = data.games || [];
      var systems = {};
      allGames.forEach(function (g) { systems[g.system] = (systems[g.system] || 0) + 1; });
      filterEl.innerHTML = '<option value="">All systems (' + allGames.length + ')</option>' + Object.keys(systems).sort().map(function (k) {
        return '<option value="' + k + '">' + (NAMES[k] || k) + ' (' + systems[k] + ')</option>';
      }).join('');
      render();
    }).catch(function () {
      statusEl.textContent = "Can't reach the ROM library. Is rom-server running on the nukebox, and are you on Tailscale? You can still play a file from this device.";
    });
  }

  var NAMES = { nds: 'Nintendo DS', gba: 'Game Boy Advance', gb: 'Game Boy / Color', nes: 'NES', snes: 'SNES', n64: 'Nintendo 64',
    psx: 'PlayStation', psp: 'PSP', segaMD: 'Genesis', amstrad: 'Amstrad CPC', ps2: 'PlayStation 2', arcade: 'Arcade' };
  var allGames = [];
  var filterEl = document.getElementById('filter');
  filterEl.onchange = render;
  function render() {
    var only = filterEl.value;
    var games = allGames.filter(function (g) { return !only || g.system === only; });
    var playable = games.filter(function (g) { return g.supported !== false; }).length;
    statusEl.textContent = playable + ' playable' + (games.length > playable ? ' · ' + (games.length - playable) + " need hardware a browser can't emulate" : '');
    grid.innerHTML = '';
    games.forEach(function (g) {
      var card = document.createElement('div');
      card.className = 'game' + (g.supported === false ? ' off' : '');
      card.innerHTML = (g.cover ? '<img loading="lazy" alt="">' : '<div class="blank">🎮</div>') + '<b></b><small></small>';
      if (g.cover) card.querySelector('img').src = lib + g.cover;
      card.querySelector('b').textContent = g.name;
      card.querySelector('small').textContent = (NAMES[g.system] || g.system) + (g.supported === false ? ' · not supported' : '');
      if (g.supported === false) card.title = (g.note || g.system) + ': no browser emulator can run this one';
      else card.onclick = function () { start(lib + g.file, g.system, g.name); };
      grid.appendChild(card);
    });
  }

  // the library names systems; a couple of EmulatorJS cores go by another name
  var CORES = { amstrad: 'cap32' };
  var started = false;
  function start(url, core, name) {
    // PSP needs threads, which only work in a cross-origin isolated top-level tab
    if (core === 'psp' && !window.crossOriginIsolated) {
      var target = location.pathname + '?rom=' + encodeURIComponent(url) + '&core=psp&name=' + encodeURIComponent(name || '');
      if (window.top !== window) {
        window.open(target, '_blank');
        statusEl.textContent = 'PSP games need their own tab, so it opened in a new one.';
        return;
      }
    }
    if (started) { location.href = '?rom=' + encodeURIComponent(url) + '&core=' + core + '&name=' + encodeURIComponent(name || ''); return; }
    started = true;
    document.getElementById('player').classList.add('on');
    window.EJS_player = '#game';
    window.EJS_core = CORES[core] || core;
    if (core === 'psp') window.EJS_threads = true;
    window.EJS_gameUrl = url;
    window.EJS_gameName = name || 'game';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_color = '#3d8bff';
    // the room's controller drives input (see cak3dInput below), so the emulator's own keyboard map is left empty
    window.EJS_defaultControls = { 0: {}, 1: {}, 2: {}, 3: {} };
    var s = document.createElement('script');
    s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(s);
  }

  document.getElementById('save').onclick = load;
  document.getElementById('pickBtn').onclick = function () { document.getElementById('pick').click(); };
  document.getElementById('pick').onchange = function (e) {
    var f = e.target.files[0];
    if (f) start(URL.createObjectURL(f), document.getElementById('core').value, f.name);
  };
  document.getElementById('back').onclick = function () { location.href = location.pathname; };

  // Hooks for the 3D room (same origin): press RetroPad buttons, go back to the library
  window.cak3dInput = function (index, value) {
    var gm = window.EJS_emulator && window.EJS_emulator.gameManager;
    if (gm && gm.simulateInput) gm.simulateInput(0, index, value);
  };
  window.cak3dHome = function () { location.href = location.pathname; };
  // when this frame has focus, hand keys and clicks up to the room so the controller still works
  ['keydown', 'keyup'].forEach(function (type) {
    window.addEventListener(type, function (e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      window.parent.postMessage({ type: 'cak3d-tv-key', down: type === 'keydown', key: e.key }, '*');
    });
  });
  window.addEventListener('mousedown', function () { window.parent.postMessage({ type: 'cak3d-tv-click' }, '*'); });

  var q = new URLSearchParams(location.search);
  if (q.get('rom')) start(q.get('rom'), q.get('core') || 'nds', q.get('name'));
  else load();
</script>
</body>
</html>
